<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">DevPilot 全栈 AI 研发效能工作台业务流程图</title>
  <desc id="desc">展示用户入口、FastAPI 接口与后台任务、Agent 工作流、RAG 与 MCP 工具、CI 诊断、测试验证、受控修复和 Evaluation 之间的业务关系。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5b8fca"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e9b72"/></marker>
    <style>
      .title{font:700 32px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#16283d}.subtitle{font:400 15px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#6d8094}.col{font:700 16px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#38526b}.label{font:600 14px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#263f56}.small{font:400 12px 'Microsoft YaHei','PingFang SC',sans-serif;fill:#668096}.box{filter:url(#shadow)}.line{stroke:#5b8fca;stroke-width:2;fill:none;marker-end:url(#arrow)}.greenline{stroke:#4e9b72;stroke-width:2;fill:none;marker-end:url(#arrow-green)}.dashed{stroke:#85b7a0;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#f6f9fc"/>
  <rect x="30" y="24" width="1540" height="932" rx="14" fill="#fff" stroke="#d9e4ee" stroke-width="2"/>
  <text x="800" y="70" text-anchor="middle" class="title">DevPilot 全栈 AI 研发效能工作台</text>
  <text x="800" y="98" text-anchor="middle" class="subtitle">从问题输入、知识检索与工具执行，到证据验证、受控修复和可量化评测的完整闭环</text>
  <line x1="66" y1="125" x2="1534" y2="125" stroke="#d9e4ee"/>

  <line x1="300" y1="150" x2="300" y2="900" stroke="#b9c9d8" stroke-dasharray="5 5"/>
  <line x1="570" y1="150" x2="570" y2="900" stroke="#b9c9d8" stroke-dasharray="5 5"/>
  <line x1="1020" y1="150" x2="1020" y2="900" stroke="#b9c9d8" stroke-dasharray="5 5"/>
  <text x="170" y="160" text-anchor="middle" class="col">用户入口</text>
  <text x="435" y="160" text-anchor="middle" class="col">API 与任务层</text>
  <text x="795" y="160" text-anchor="middle" class="col">Agent 核心工作流</text>
  <text x="1275" y="160" text-anchor="middle" class="col">能力组件与结果层</text>

  <g class="box">
    <rect x="78" y="300" width="184" height="70" rx="12" fill="#eef5ff" stroke="#8cb4e8"/>
    <text x="170" y="329" text-anchor="middle" class="label">统一 AI 工作台</text><text x="170" y="351" text-anchor="middle" class="small">Chat · 知识库 · 诊断 · 评测</text>
    <rect x="78" y="445" width="184" height="70" rx="12" fill="#fff8e8" stroke="#e6bb57"/>
    <text x="170" y="474" text-anchor="middle" class="label">研发 / 测试输入</text><text x="170" y="496" text-anchor="middle" class="small">问题、文档、CI 失败、告警</text>
    <rect x="78" y="590" width="184" height="70" rx="12" fill="#eef8f1" stroke="#8ac19d"/>
    <text x="170" y="619" text-anchor="middle" class="label">任务结果查看</text><text x="170" y="641" text-anchor="middle" class="small">计划、工具、证据、报告</text>
  </g>
  <path d="M170 370V445" class="line"/><path d="M170 515V590" class="line"/>

  <g class="box">
    <rect x="340" y="250" width="190" height="66" rx="11" fill="#fff8e8" stroke="#e6bb57"/>
    <text x="435" y="278" text-anchor="middle" class="label">FastAPI 路由</text><text x="435" y="299" text-anchor="middle" class="small">认证、任务、查询、SSE</text>
    <rect x="340" y="370" width="190" height="66" rx="11" fill="#eef5ff" stroke="#8cb4e8"/>
    <text x="435" y="398" text-anchor="middle" class="label">Service / Repository</text><text x="435" y="419" text-anchor="middle" class="small">SQLAlchemy · SQLite · Alembic</text>
    <rect x="340" y="490" width="190" height="66" rx="11" fill="#eef8f1" stroke="#8ac19d"/>
    <text x="435" y="518" text-anchor="middle" class="label">BackgroundJobRuntime</text><text x="435" y="539" text-anchor="middle" class="small">队列、租约、重试、取消、恢复</text>
    <rect x="340" y="610" width="190" height="66" rx="11" fill="#f1edff" stroke="#ad9be5"/>
    <text x="435" y="638" text-anchor="middle" class="label">持久化任务状态</text><text x="435" y="659" text-anchor="middle" class="small">queued · running · completed · failed</text>
  </g>
  <path d="M262 335H340" class="line"/><path d="M435 316V370" class="line"/><path d="M435 436V490" class="greenline"/><path d="M435 556V610" class="greenline"/>

  <rect x="605" y="190" width="375" height="665" rx="16" class="dashed"/>
  <text x="625" y="218" class="small">LangGraph 有限状态工作流</text>
  <g class="box">
    <rect x="640" y="250" width="305" height="58" rx="10" fill="#eaf3ff" stroke="#72a4dd"/><text x="792" y="285" text-anchor="middle" class="label">Failure Analyzer｜失败分析</text>
    <rect x="640" y="340" width="305" height="58" rx="10" fill="#eaf3ff" stroke="#72a4dd"/><text x="792" y="375" text-anchor="middle" class="label">Planner｜规划工具与验证步骤</text>
    <rect x="640" y="430" width="305" height="58" rx="10" fill="#eaf3ff" stroke="#72a4dd"/><text x="792" y="465" text-anchor="middle" class="label">Executor｜执行只读工具</text>
    <rect x="640" y="520" width="305" height="58" rx="10" fill="#eaf3ff" stroke="#72a4dd"/><text x="792" y="555" text-anchor="middle" class="label">Evidence Collector｜收集客观证据</text>
    <rect x="640" y="610" width="305" height="58" rx="10" fill="#fff6df" stroke="#e4b94f"/><text x="792" y="645" text-anchor="middle" class="label">Replanner + Budget｜补证据与预算约束</text>
    <rect x="640" y="700" width="305" height="58" rx="10" fill="#eaf7ef" stroke="#73b78c"/><text x="792" y="735" text-anchor="middle" class="label">Verifier / Report｜结论与报告</text>
  </g>
  <path d="M530 523H600V279H640" class="greenline"/><path d="M792 308V340" class="greenline"/><path d="M792 398V430" class="greenline"/><path d="M792 488V520" class="greenline"/><path d="M792 578V610" class="greenline"/><path d="M792 668V700" class="greenline"/><path d="M640 639H615V459H640" class="dashed"/>

  <g class="box">
    <rect x="1060" y="205" width="225" height="70" rx="11" fill="#f1edff" stroke="#ad9be5"/><text x="1172" y="234" text-anchor="middle" class="label">RAG 知识库</text><text x="1172" y="256" text-anchor="middle" class="small">Milvus + BM25L + RRF + Rerank</text>
    <rect x="1320" y="205" width="225" height="70" rx="11" fill="#f1edff" stroke="#ad9be5"/><text x="1432" y="234" text-anchor="middle" class="label">MCP 外部工具</text><text x="1432" y="256" text-anchor="middle" class="small">日志 · 告警 · 指标 · 知识</text>
    <rect x="1060" y="350" width="225" height="80" rx="11" fill="#eef5ff" stroke="#8cb4e8"/><text x="1172" y="381" text-anchor="middle" class="label">CI 只读工具</text><text x="1172" y="404" text-anchor="middle" class="small">测试日志 · Git Diff / Log</text><text x="1172" y="421" text-anchor="middle" class="small">源码读取 · 代码搜索</text>
    <rect x="1320" y="350" width="225" height="80" rx="11" fill="#eef5ff" stroke="#8cb4e8"/><text x="1432" y="381" text-anchor="middle" class="label">Evidence 链</text><text x="1432" y="404" text-anchor="middle" class="small">Observation · Hypothesis</text><text x="1432" y="421" text-anchor="middle" class="small">多来源绑定与可追溯引用</text>
    <rect x="1060" y="505" width="225" height="80" rx="11" fill="#fff8e8" stroke="#e6bb57"/><text x="1172" y="536" text-anchor="middle" class="label">Safe Test Runner</text><text x="1172" y="559" text-anchor="middle" class="small">命令白名单 · 超时 · 取消</text><text x="1172" y="576" text-anchor="middle" class="small">shell=False · 输出截断</text>
    <rect x="1320" y="505" width="225" height="80" rx="11" fill="#fff8e8" stroke="#e6bb57"/><text x="1432" y="536" text-anchor="middle" class="label">Controlled Repair</text><text x="1432" y="559" text-anchor="middle" class="small">Structured Patch · 隔离工作区</text><text x="1432" y="576" text-anchor="middle" class="small">测试失败回滚 · 原仓库只读</text>
    <rect x="1060" y="670" width="485" height="92" rx="11" fill="#eaf7ef" stroke="#73b78c"/><text x="1302" y="704" text-anchor="middle" class="label">Evaluation 评测与报告</text><text x="1302" y="728" text-anchor="middle" class="small">20 Case · 10 类故障 · Fault Injection</text><text x="1302" y="747" text-anchor="middle" class="small">根因、确认、工具、证据、步骤、延迟与回归对比</text>
  </g>
  <path d="M945 279H1060" class="line"/><path d="M945 459H1060" class="line"/><path d="M945 459H1035V390H1320" class="line"/><path d="M945 729H1035V545H1060" class="greenline"/><path d="M945 729H1035V545H1320" class="greenline"/><path d="M945 729H1060V716" class="greenline"/>
  <path d="M1172 275V350" class="dashed"/><path d="M1432 275V350" class="dashed"/><path d="M1172 430V505" class="dashed"/><path d="M1432 430V505" class="dashed"/>
  <text x="800" y="914" text-anchor="middle" class="small">统一安全边界：Owner / Tenant Scope · Workspace Guard · ToolResult · Diagnosis Budget · 事件先持久化后推送</text>
</svg>
